<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Monitor Console</title>
    <link href="https://cdn.jsdelivr.net" rel="stylesheet">
    <style>
        body { background: #f4f7f6; }
        .card-img-top { height: 200px; object-fit: cover; cursor: pointer; }
        .user-badge { position: absolute; top: 10px; left: 10px; }
        .timestamp { font-size: 0.8rem; color: #6c757d; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand">Система Мониторинга: AI Dashboard 2026</span>
        </div>
    </nav>

    <div class="container">
        <div class="row" id="logs-container">
            <!-- Сюда JavaScript будет подставлять карточки -->
        </div>
    </div>

    <script>
        async function loadLogs() {
            const response = await fetch('/api/admin/overview');
            const logs = await response.json();
            const container = document.getElementById('logs-container');
            container.innerHTML = '';

            logs.forEach(log => {
                const card = `
                    <div class="col-md-4 mb-4">
                        <div class="card shadow-sm h-100">
                            <span class="badge bg-primary user-badge">${log.username}</span>
                            <img src="${log.image_url}" class="card-img-top" onclick="window.open(this.src)">
                            <div class="card-body">
                                <p class="timestamp">${log.timestamp}</p>
                                <p class="card-text"><strong>Анализ ИИ:</strong> ${log.ai_analysis}</p>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += card;
            });
        }

        // Обновлять данные каждые 5 секунд
        setInterval(loadLogs, 5000);
        loadLogs();
    </script>
</body>
</html>
