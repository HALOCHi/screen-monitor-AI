<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>AI Monitor Control Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .log-card img { transition: transform 0.2s; }
        .log-card:hover img { transform: scale(1.02); }
    </style>
</head>
<body class="bg-gray-50 font-sans">
    <div class="flex h-screen">
        <!-- Боковая панель -->
        <div class="w-72 bg-slate-900 text-white flex flex-col">
            <div class="p-6 border-b border-slate-800">
                <h1 class="text-xl font-bold flex items-center gap-2">
                    <span class="text-2xl">🛡️</span> AI Screen
                </h1>
            </div>
            <div id="user-list" class="flex-1 overflow-y-auto p-4 space-y-2">
                <p class="text-slate-500 text-xs uppercase font-semibold px-2">Сотрудники</p>
                <!-- Сюда вставятся пользователи -->
            </div>
        </div>

        <!-- Основная область -->
        <div class="flex-1 flex flex-col overflow-hidden">
            <header class="h-16 bg-white border-b flex items-center justify-between px-8 shadow-sm">
                <h2 id="current-user-name" class="text-lg font-semibold text-gray-700">Выберите пользователя</h2>
                <button onclick="loadUsers()" class="text-sm bg-gray-100 hover:bg-gray-200 px-4 py-2 rounded-md transition">🔄 Обновить данные</button>
            </header>

            <main id="logs-container" class="flex-1 overflow-y-auto p-8 grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
                <div class="col-span-full text-center py-20 text-gray-400">
                    Нажмите на пользователя слева, чтобы увидеть историю активности
                </div>
            </main>
        </div>
    </div>

    <script>
        // Функция для загрузки списка пользователей
        async function loadUsers() {
            try {
                const response = await fetch('/api/users');
                const users = await response.json();
                const container = document.getElementById('user-list');
                
                // Очищаем список, оставляя заголовок
                container.innerHTML = '<p class="text-slate-500 text-xs uppercase font-semibold px-2 mb-2">Сотрудники</p>';
                
                users.forEach(user => {
                    const btn = document.createElement('div');
                    btn.className = 'cursor-pointer p-3 rounded-xl hover:bg-slate-800 transition flex items-center gap-3';
                    btn.innerHTML = `<span>👤</span> ${user}`;
                    btn.onclick = () => selectUser(user, btn);
                    container.appendChild(btn);
                });
            } catch (e) {
                console.error("Ошибка загрузки пользователей:", e);
            }
        }

        // Функция для загрузки логов конкретного пользователя
        async function selectUser(username, element) {
            // Подсветка активного пользователя
            document.querySelectorAll('#user-list div').forEach(el => el.classList.remove('bg-blue-600'));
            element.classList.add('bg-blue-600');
            
            document.getElementById('current-user-name').innerText = `Активность: ${username}`;
            const container = document.getElementById('logs-container');
            container.innerHTML = '<div class="col-span-full text-center">Загрузка...</div>';

            try {
                const response = await fetch(`/api/logs/${username}`);
                const logs = await response.json();
                
                container.innerHTML = ''; // Очищаем

                if (logs.length === 0) {
                    container.innerHTML = '<div class="col-span-full text-center text-gray-400">Нет записей</div>';
                    return;
                }

                logs.forEach(log => {
                    const card = document.createElement('div');
                    card.className = 'log-card bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden flex flex-col';
                    card.innerHTML = `
                        <div class="relative aspect-video bg-gray-200">
                            <img src="${log.image_url}" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com'">
                            <div class="absolute top-3 right-3 bg-black/40 backdrop-blur text-white text-[10px] px-2 py-1 rounded-full">
                                ${log.timestamp.split(' ')[1]}
                            </div>
                        </div>
                        <div class="p-4 flex-1">
                <!-- ... заголовок "AI Анализ" ... -->
                <div class="bg-blue-50 p-3 rounded-lg border border-blue-100">
                    <p class="text-sm text-gray-700 leading-snug font-medium overflow-y-auto max-h-24">
                        <strong>AI:</strong> ${log.ai_analysis}
                    </p>
                </div>
            </div>
                    `;
                    container.appendChild(card);
                });
            } catch (e) {
                container.innerHTML = '<div class="col-span-full text-red-500">Ошибка загрузки данных</div>';
            }
        }

        // Запускаем при загрузке страницы
        loadUsers();
        // Автообновление списка каждые 30 секунд
        setInterval(loadUsers, 30000);
    </script>
</body>
</html>
